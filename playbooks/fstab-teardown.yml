#!/usr/bin/env ansible-playbook
---
- name: "Revert Btrfs Mount Tuning in /etc/fstab (CachyOS)"
  hosts: cluster_nodes
  become: true
  vars:
    # Used only when fstab-setup.yml never recorded the original options:
    # the CachyOS installer default for the root subvolume.
    fallback_root_opts: "subvol=/@,defaults,noatime,compress=zstd:1"
    restore_root_opts: "{{ ansible_local['mikmakmuk_fstab']['root_opts'] | default(fallback_root_opts) }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Discover Root Filesystem
    # -------------------------------------------------------------------------
    - name: Discover Btrfs root filesystem
      ansible.builtin.import_tasks: tasks/fstab-root-mount.yml

    # -------------------------------------------------------------------------
    # 2. Restore Original /etc/fstab Options
    # -------------------------------------------------------------------------
    - name: Restore original root Btrfs mount options in /etc/fstab
      ansible.posix.mount:
        path: /
        src: "UUID={{ root_uuid }}"
        fstype: btrfs
        opts: "{{ restore_root_opts }}"
        state: present
        backup: true
      notify: Remount root filesystem

    - name: Apply root remount when fstab changed
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # 3. Validation & State Cleanup
    # -------------------------------------------------------------------------
    - name: Verify /etc/fstab syntax with findmnt
      ansible.builtin.command: "findmnt --verify --verbose"
      changed_when: false

    - name: Refresh mount facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - mounts

    - name: Display reverted mount configuration
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "UUID: {{ root_uuid }}"
          - "Restored Options: {{ restore_root_opts }}"
          - "Active Mount Options: {{ root_active_mount['options'] }}"
      vars:
        root_active_mount: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"

    - name: Remove recorded fstab state
      ansible.builtin.file:
        path: /etc/ansible/facts.d/mikmakmuk_fstab.fact
        state: absent

  handlers:
    - name: Remount root filesystem
      ansible.posix.mount:
        path: /
        state: remounted
