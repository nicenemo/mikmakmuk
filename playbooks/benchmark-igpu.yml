#!/usr/bin/env ansible-playbook
---
- name: "Cluster Integrated GPU (Intel UHD 630) Performance & Thermal Benchmark"
  hosts: cluster_nodes
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Ensure iGPU Dependencies Are Present
    # -------------------------------------------------------------------------
    - name: "Install iGPU benchmark dependencies"
      community.general.pacman:
        name:
          - intel-gpu-tools
          - intel-media-driver
          - libva-utils
          - clinfo
          - glmark2
          - lm_sensors
        state: present
        update_cache: true

    # -------------------------------------------------------------------------
    # 2. Baseline Pre-Test Thermal Readings
    # -------------------------------------------------------------------------
    - name: "Query Pre-Test CPU/iGPU Core Temperature"
      ansible.builtin.shell:
        cmd: "sensors 2>/dev/null | grep -iE '(Package id 0|Core 0)' | head -n1 | awk '{print $4}' | tr -d '+°C' || echo 'N/A'"
      register: igpu_temp_pre_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. Check OpenCL Hardware Compute Capability
    # -------------------------------------------------------------------------
    - name: "Check OpenCL Platform / Intel UHD Driver Readiness"
      ansible.builtin.shell:
        cmd: "clinfo 2>/dev/null | grep -i 'Platform Name' | head -n1 | awk -F': ' '{print $2}' || echo 'No OpenCL Provider'"
      register: opencl_platform_raw
      changed_when: false

    - name: "Check OpenCL Max Compute Units"
      ansible.builtin.shell:
        cmd: "clinfo 2>/dev/null | grep -i 'Max compute units' | head -n1 | awk '{print $4}' || echo '0'"
      register: opencl_units_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 4. Check VA-API Hardware Decode Profiles
    # -------------------------------------------------------------------------
    - name: "Check VA-API Hardware Decode Profiles"
      ansible.builtin.shell:
        cmd: "vainfo 2>/dev/null | grep -c 'VAProfile' || echo '0'"
      register: vaapi_profiles_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 5. Offscreen OpenGL Rendering Score (glmark2)
    # -------------------------------------------------------------------------
    - name: "Run Offscreen EGL/OpenGL Benchmark (glmark2-es2-drm)"
      ansible.builtin.shell:
        cmd: "glmark2-es2-drm --off-screen 2>&1 | grep 'glmark2 Score:' | awk -F': ' '{print $2}' || echo 'N/A'"
      register: glmark2_score_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 6. Query Max GPU Clock Rate
    # -------------------------------------------------------------------------
    - name: "Query iGPU Max Frequency"
      ansible.builtin.shell:
        cmd: "cat /sys/class/drm/card0/gt_max_freq_mhz 2>/dev/null || cat /sys/class/drm/card0/gt/gt0/rps_max_freq_mhz 2>/dev/null || echo 'N/A'"
      register: igpu_max_freq_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 7. Post-Test Thermal & GPU Driver Throttling Audit
    # -------------------------------------------------------------------------
    - name: "Query Post-Test CPU/iGPU Core Temperature"
      ansible.builtin.shell:
        cmd: "sensors 2>/dev/null | grep -iE '(Package id 0|Core 0)' | head -n1 | awk '{print $4}' | tr -d '+°C' || echo 'N/A'"
      register: igpu_temp_post_raw
      changed_when: false

    - name: "Check i915 / GPU Thermal and Power Limitation Events"
      ansible.builtin.shell:
        cmd: "dmesg | grep -iE '(i915|gpu|thermal|throttle|power limit)' | grep -iE '(downclock|throttl|limit|overtemp)' | tail -n2 || echo 'None Detected'"
      register: gpu_throttle_logs_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 8. Gather iGPU Facts & Summary
    # -------------------------------------------------------------------------
    - name: "Compile iGPU Telemetry Facts"
      ansible.builtin.set_fact:
        node_igpu_bench:
          gpu_model: "Intel UHD Graphics 630"
          max_clock: "{{ igpu_max_freq_raw.stdout | trim }} MHz"
          opencl_provider: "{{ opencl_platform_raw.stdout | trim }}"
          opencl_units: "{{ opencl_units_raw.stdout | trim }} EUs"
          vaapi_supported_codecs: "{{ vaapi_profiles_raw.stdout | trim }} profiles"
          glmark2_score: "{{ glmark2_score_raw.stdout | trim }}"
          igpu_temp_delta: "{{ igpu_temp_pre_raw.stdout | trim }} °C (Idle) --> {{ igpu_temp_post_raw.stdout | trim }} °C (Post-Test)"
          gpu_throttle_events: "{{ gpu_throttle_logs_raw.stdout | trim }}"

    # -------------------------------------------------------------------------
    # 9. Print Consolidated Output Matrix
    # -------------------------------------------------------------------------
    - name: "Display iGPU Benchmark Summary"
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "        CLUSTER INTEGRATED GPU (UHD 630) BENCHMARK & THERMAL MATRIX"
          - "========================================================================="
          - "Host                     : {{ inventory_hostname.upper() }}"
          - "iGPU Hardware            : {{ node_igpu_bench.gpu_model }} (Max: {{ node_igpu_bench.max_clock }})"
          - "OpenCL Platform          : {{ node_igpu_bench.opencl_provider }} ({{ node_igpu_bench.opencl_units }})"
          - "VA-API Hardware Codecs   : {{ node_igpu_bench.vaapi_supported_codecs }}"
          - "glmark2 Offscreen Score  : {{ node_igpu_bench.glmark2_score }}"
          - "Core Thermal Delta       : {{ node_igpu_bench.igpu_temp_delta }}"
          - "GPU Throttling / Log Event: {{ node_igpu_bench.gpu_throttle_events }}"
          - "-------------------------------------------------------------------------"
