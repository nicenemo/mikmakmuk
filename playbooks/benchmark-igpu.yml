#!/usr/bin/env ansible-playbook
---
- name: Benchmark integrated GPU (Intel UHD 630) compute, media and 3D performance
  hosts: cluster_nodes
  become: true
  vars_files:
    - vars/benchmark.yml
  vars:
    igpu_gpu_env:
      MESA_LOADER_DRIVER_OVERRIDE: iris
      LIBGL_ALWAYS_SOFTWARE: "0"
      RUSTICL_ENABLE: iris
    igpu_weston_unit: mikmakmuk-benchmark-weston
    igpu_wayland_env:
      XDG_RUNTIME_DIR: "/run/{{ igpu_weston_unit }}"
      WAYLAND_DISPLAY: wayland-benchmark
    igpu_3d_timeout_s: 900
  environment: "{{ igpu_gpu_env }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Dependencies & Idle Baseline
    # -------------------------------------------------------------------------
    - name: Install iGPU compute, media, Vulkan and Wayland benchmark tooling
      community.general.pacman:
        name: >-
          {{ benchmark_tool_packages.igpu
              + ['intel-gpu-tools', 'libva-utils', 'intel-media-driver', 'mesa', 'vulkan-intel', 'lm_sensors'] }}
        state: present

    - name: Read idle temperatures
      ansible.builtin.import_tasks: tasks/read-sensors.yml

    - name: Record idle temperatures
      ansible.builtin.set_fact:
        igpu_temps_idle: "{{ sensor_temps }}"

    - name: Refresh node clock facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - date_time

    - name: Record benchmark start time
      ansible.builtin.set_fact:
        igpu_start_epoch: "{{ ansible_facts['date_time']['epoch'] }}"

    # -------------------------------------------------------------------------
    # 2. Capability Audit (VA-API & Frequency Limits)
    # -------------------------------------------------------------------------
    - name: Query VA-API driver and profiles on the DRM render node
      ansible.builtin.command:
        cmd: vainfo --display drm --device /dev/dri/renderD128
      environment:
        LIBVA_DRIVER_NAME: iHD
      register: igpu_vainfo_raw
      changed_when: false

    - name: Query iGPU frequency limits
      ansible.builtin.command:
        cmd: intel_gpu_frequency --get
      register: igpu_freq_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. Peak Compute & Memory Bandwidth (clpeak, OpenCL + Vulkan)
    # -------------------------------------------------------------------------
    - name: Run clpeak compute and bandwidth benchmark
      block:
        - name: Create temporary clpeak results file
          ansible.builtin.tempfile:
            state: file
            suffix: .clpeak.json
          register: igpu_clpeak_file

        - name: Run clpeak FP32 compute and global memory bandwidth tests
          ansible.builtin.command:
            cmd: >-
              clpeak --opencl --vulkan --single-precision-compute --global-memory-bandwidth
              --output {{ igpu_clpeak_file.path }}
          changed_when: false

        - name: Read clpeak results
          ansible.builtin.slurp:
            src: "{{ igpu_clpeak_file.path }}"
          register: igpu_clpeak_raw

      always:
        - name: Remove temporary clpeak results file
          ansible.builtin.file:
            path: "{{ igpu_clpeak_file.path }}"
            state: absent
          when: igpu_clpeak_file.path is defined

    # -------------------------------------------------------------------------
    # 4. Headless Wayland 3D Benchmarks (vkmark + glmark2-es2)
    # -------------------------------------------------------------------------
    - name: Run headless Wayland 3D benchmarks
      block:
        - name: Install runtime unit for the headless Weston compositor
          ansible.builtin.template:
            src: "{{ project_root }}/templates/benchmark-weston.service.j2"
            dest: "/run/systemd/system/{{ igpu_weston_unit }}.service"
            owner: root
            group: root
            mode: "0644"
          register: igpu_weston_unit_file

        - name: Start headless Weston compositor
          ansible.builtin.systemd_service:
            name: "{{ igpu_weston_unit }}.service"
            state: started
            daemon_reload: true

        - name: Wait for the Weston Wayland socket
          ansible.builtin.wait_for:
            path: "{{ igpu_wayland_env['XDG_RUNTIME_DIR'] }}/{{ igpu_wayland_env['WAYLAND_DISPLAY'] }}"
            timeout: 15

        - name: Run vkmark Vulkan benchmark
          ansible.builtin.command:
            cmd: vkmark --winsys=wayland
          environment: "{{ igpu_gpu_env | combine(igpu_wayland_env) }}"
          register: igpu_vkmark_raw
          changed_when: false
          timeout: "{{ igpu_3d_timeout_s }}"

        - name: Run glmark2 OpenGL ES 2 benchmark
          ansible.builtin.command:
            cmd: glmark2-es2-wayland --off-screen
          environment: "{{ igpu_gpu_env | combine(igpu_wayland_env) }}"
          register: igpu_glmark2_raw
          changed_when: false
          timeout: "{{ igpu_3d_timeout_s }}"

      always:
        - name: Stop headless Weston compositor
          ansible.builtin.systemd_service:
            name: "{{ igpu_weston_unit }}.service"
            state: stopped
          when: igpu_weston_unit_file is succeeded

        - name: Remove runtime unit for the headless Weston compositor
          ansible.builtin.file:
            path: "/run/systemd/system/{{ igpu_weston_unit }}.service"
            state: absent
          notify: Reload systemd

    # -------------------------------------------------------------------------
    # 5. Post-Test Thermal & Throttling Audit
    # -------------------------------------------------------------------------
    - name: Read post-test temperatures
      ansible.builtin.import_tasks: tasks/read-sensors.yml

    - name: Collect throttling events logged during the benchmark
      ansible.builtin.import_tasks: tasks/kernel-throttle-events.yml
      vars:
        throttle_since_epoch: "{{ igpu_start_epoch }}"

    # -------------------------------------------------------------------------
    # 6. Compile & Save Results
    # -------------------------------------------------------------------------
    - name: Select clpeak devices per backend
      ansible.builtin.set_fact:
        igpu_opencl: >-
          {{ (igpu_clpeak_raw.content | b64decode | from_json).devices
              | selectattr('backend', 'equalto', 'OpenCL') | first | default({}) }}
        igpu_vulkan: >-
          {{ (igpu_clpeak_raw.content | b64decode | from_json).devices
              | selectattr('backend', 'equalto', 'Vulkan') | first | default({}) }}

    - name: Compile iGPU benchmark result
      ansible.builtin.set_fact:
        igpu_result:
          gpu_model: "{{ igpu_vulkan.name | default(igpu_opencl.name | default(none)) }}"
          vulkan_driver: "{{ igpu_vulkan.driver | default(none) }}"
          opencl_platform: "{{ igpu_opencl.platform | default(none) }}"
          opencl_driver: "{{ igpu_opencl.driver | default(none) }}"
          opencl_compute_units: >-
            {{ igpu_opencl.properties | default([]) | selectattr('key', 'equalto', 'Compute units')
                | map(attribute='value') | map('int') | first | default(none) }}
          min_freq_mhz: >-
            {{ igpu_freq_raw.stdout | regex_findall('min: ([0-9]+) MHz') | map('int') | first | default(none) }}
          max_freq_mhz: >-
            {{ igpu_freq_raw.stdout | regex_findall('max: ([0-9]+) MHz') | map('int') | first | default(none) }}
          opencl_sp_gflops: "{{ ((opencl_sp | map('float') | max) / 1e9) | round(1) if opencl_sp else none }}"
          opencl_bandwidth_gbs: "{{ ((opencl_bw | map('float') | max) / 1e9) | round(1) if opencl_bw else none }}"
          vulkan_sp_gflops: "{{ ((vulkan_sp | map('float') | max) / 1e9) | round(1) if vulkan_sp else none }}"
          vulkan_bandwidth_gbs: "{{ ((vulkan_bw | map('float') | max) / 1e9) | round(1) if vulkan_bw else none }}"
          vaapi_driver: >-
            {{ igpu_vainfo_raw.stdout | regex_findall('Driver version: (.+)') | map('trim') | first | default(none) }}
          vaapi_profile_count: "{{ igpu_vainfo_raw.stdout_lines | select('search', 'VAProfile') | list | length }}"
          vkmark_score: >-
            {{ igpu_vkmark_raw.stdout | regex_findall('vkmark Score: ([0-9]+)') | map('int') | first | default(none) }}
          glmark2_score: >-
            {{ igpu_glmark2_raw.stdout | regex_findall('glmark2 Score: ([0-9]+)') | map('int')
                | first | default(none) }}
          gl_renderer: >-
            {{ igpu_glmark2_raw.stdout | regex_findall('GL_RENDERER: +(.+)') | map('trim') | first | default(none) }}
          cpu_temp_idle_c: "{{ igpu_temps_idle.cpu_package_c }}"
          cpu_temp_post_c: "{{ sensor_temps.cpu_package_c }}"
          throttle_event_count: "{{ throttle_events | length }}"
          throttle_events: "{{ throttle_events[-5:] }}"
      vars:
        # Metric values (FLOPS or B/s) per vector width for each clpeak test
        opencl_sp: >-
          {{ igpu_opencl.tests | default([]) | selectattr('id', 'equalto', 'single_precision_compute')
              | map(attribute='metrics') | flatten | map(attribute='value') | list }}
        opencl_bw: >-
          {{ igpu_opencl.tests | default([]) | selectattr('id', 'equalto', 'global_memory_bandwidth')
              | map(attribute='metrics') | flatten | map(attribute='value') | list }}
        vulkan_sp: >-
          {{ igpu_vulkan.tests | default([]) | selectattr('id', 'equalto', 'single_precision_compute')
              | map(attribute='metrics') | flatten | map(attribute='value') | list }}
        vulkan_bw: >-
          {{ igpu_vulkan.tests | default([]) | selectattr('id', 'equalto', 'global_memory_bandwidth')
              | map(attribute='metrics') | flatten | map(attribute='value') | list }}

    - name: Save iGPU benchmark result
      ansible.builtin.import_tasks: tasks/save-benchmark-result.yml
      vars:
        benchmark_name: igpu
        benchmark_result: "{{ igpu_result }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
