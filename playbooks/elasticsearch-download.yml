#!/usr/bin/env ansible-playbook
---
- name: Download Elasticsearch
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    # Fetches elk_version from inventory.yml (defaults to 9.5.3 if undefined)
    target_version: "{{ hostvars[groups['cluster_nodes'][0]]['elk_version'] if (groups['cluster_nodes'] is defined and hostvars[groups['cluster_nodes'][0]]['elk_version'] is defined) else '9.5.3' }}"
    build_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['env']['USER'] | default(lookup('ansible.builtin.env', 'USER'))) }}"

  tasks:
    - name: Verify if requested Elasticsearch version exists on Elastic servers
      ansible.builtin.uri:
        url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ target_version }}-linux-x86_64.tar.gz"
        method: HEAD
        status_code: [200, 404]
        timeout: 5
      register: version_check
      ignore_errors: true

    - name: Fail early if Elasticsearch version is not available
      ansible.builtin.fail:
        msg: "Version '{{ target_version }}' does not exist on artifacts.elastic.co (HTTP Status {{ version_check.status | default('unknown') }}). Please check 'elk_version' in inventory.yml!"
      when: version_check.status is not defined or version_check.status != 200

    - name: Set resolved version fact
      ansible.builtin.set_fact:
        resolved_elk_version: "{{ target_version }}"

    - name: Display active ELK version
      ansible.builtin.debug:
        msg: "Elasticsearch version successfully verified: {{ resolved_elk_version }}"

    # Define build path variables
    - name: Set path facts for local build
      ansible.builtin.set_fact:
        build_dir: "{{ project_root }}/build/elasticsearch"
        pkg_file_name: "elasticsearch-{{ resolved_elk_version }}-1-x86_64.pkg.tar.zst"

    - name: Ensure target build directory exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        owner: "{{ build_user }}"
        mode: '0755'

    - name: Download official SHA512 checksum file
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz.sha512"
        dest: "{{ build_dir }}/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz.sha512"
        mode: '0644'

    - name: Read checksum value from downloaded .sha512 file
      ansible.builtin.slurp:
        src: "{{ build_dir }}/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz.sha512"
      register: checksum_file

    - name: Download Elasticsearch tarball locally with checksum verification
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz"
        dest: "{{ build_dir }}/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz"
        checksum: "sha512:{{ (checksum_file.content | b64decode).split()[0] }}"
        mode: '0644'
