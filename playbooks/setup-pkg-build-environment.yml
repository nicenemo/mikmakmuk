#!/usr/bin/env ansible-playbook
---
- name: Setup package build environment.
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    # Fetches elk_version from inventory.yml (defaults to 9.5.3 if undefined)
    target_version: "{{ hostvars[groups['cluster_nodes'][0]]['elk_version'] if (groups['cluster_nodes'] is defined and hostvars[groups['cluster_nodes'][0]]['elk_version'] is defined) else '9.5.3' }}"
    build_user: "{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) }}"

  tasks:
    # Define build path variables
    - name: Set path facts for local build
      ansible.builtin.set_fact:
        build_dir: "{{ project_root }}/build/elasticsearch"
    - name: Create local build directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ build_dir }}"
        - "{{ build_dir }}/pkg_build"
