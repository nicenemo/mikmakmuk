#!/usr/bin/env ansible-playbook
---
- name: Configure USB-C Cluster Network & Verify Interface State
  hosts: cluster_nodes
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Ensure NetworkManager is Present and Running
    # -------------------------------------------------------------------------
    - name: Ensure NetworkManager package is present
      community.general.pacman:
        name: networkmanager
        state: present

    - name: Ensure NetworkManager service is enabled and running
      ansible.builtin.systemd_service:
        name: NetworkManager
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. Dynamic Dongle Discovery
    # -------------------------------------------------------------------------
    - name: Identify active primary management interface
      ansible.builtin.set_fact:
        mgmt_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"

    - name: Discover physical ethernet interface excluding management and loopback
      ansible.builtin.set_fact:
        discovered_usb_iface: >-
          {{
            ansible_facts['interfaces']
            | reject('equalto', 'lo')
            | reject('equalto', mgmt_interface)
            | select('match', '^(eth|en|enp|wlx|usb).*')
            | list
            | first
          }}

    - name: Verify a valid USB dongle interface was discovered
      ansible.builtin.assert:
        that:
          - discovered_usb_iface is defined
          - discovered_usb_iface | length > 0
        fail_msg: "No available secondary USB ethernet interface found on host {{ inventory_hostname }}."

    # -------------------------------------------------------------------------
    # 3. Apply Dedicated Cluster Network Configuration (MTU 9000 Jumbo Frames)
    # -------------------------------------------------------------------------
    - name: Configure static IP and MTU 9000 on discovered USB interface
      community.general.nmcli:
        conn_name: "{{ cluster_connection_name }}"
        ifname: "{{ discovered_usb_iface }}"
        type: ethernet
        ip4: "{{ cluster_ip }}/24"
        mtu: 9000
        state: present
      register: nmcli_profile

    - name: Activate cluster connection profile (re-applied when the profile changed)
      community.general.nmcli:
        conn_name: "{{ cluster_connection_name }}"
        conn_reload: "{{ nmcli_profile is changed }}"
        state: up

    # -------------------------------------------------------------------------
    # 4. Verification from Interface Facts & Link Speed Assertion
    # -------------------------------------------------------------------------
    - name: Refresh network interface facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - network

    - name: Verify cluster interface is up with its static IP and jumbo frames
      ansible.builtin.assert:
        that:
          - cluster_iface_facts['active'] | bool
          - cluster_iface_facts['ipv4']['address'] | default('') == cluster_ip
          - cluster_iface_facts['mtu'] | int == 9000
        fail_msg: >-
          {{ discovered_usb_iface }}: active={{ cluster_iface_facts['active'] }},
          ipv4={{ cluster_iface_facts['ipv4']['address'] | default('none') }}, mtu={{ cluster_iface_facts['mtu'] }}
        quiet: true
      vars:
        cluster_iface_facts: "{{ ansible_facts[discovered_usb_iface | replace('-', '_')] }}"

    - name: Set formatted link speed fact
      ansible.builtin.set_fact:
        negotiated_link_speed: >-
          {{ (link_speed ~ ' Mbps') if link_speed | int > 0 else 'Unknown (Link Down/Unnegotiated)' }}
      vars:
        link_speed: "{{ ansible_facts[discovered_usb_iface | replace('-', '_')]['speed'] | default(-1) }}"

    - name: Display cluster network verification summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "SUCCESS: {{ inventory_hostname }} cluster network verified!"
          - "Interface: {{ discovered_usb_iface }}"
          - "Assigned IP: {{ cluster_ip }}/24 (MTU 9000)"
          - "Profile '{{ cluster_connection_name }}' ACTIVE"
          - "Physical Link State: UP (MTU 9000 verified)"
          - "Negotiated Link Speed: {{ negotiated_link_speed }}"
          - "=========================================================="
