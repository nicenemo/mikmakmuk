#!/usr/bin/env ansible-playbook
---
- name: Apply Base System Packages and Environment Configuration
  hosts: cluster_nodes
  become: true
  vars:
    base_packages: "{{ (common_packages | default([])) + (node_packages | default([])) }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Package Management & Keyring Maintenance
    # -------------------------------------------------------------------------
    - name: Initialize pacman keyring if missing or unpopulated
      ansible.builtin.command:
        cmd: pacman-key --init
        creates: /etc/pacman.d/gnupg/trustdb.gpg

    - name: Populate default Arch and CachyOS keyrings
      ansible.builtin.command:
        cmd: pacman-key --populate archlinux cachyos
      changed_when: false

    # Keyrings first so the full upgrade below never fails on new signing keys.
    - name: Refresh package databases and update keyrings
      community.general.pacman:
        name:
          - archlinux-keyring
          - cachyos-keyring
        state: latest
        update_cache: true

    - name: Upgrade all system packages
      community.general.pacman:
        upgrade: true

    # -------------------------------------------------------------------------
    # 2. Record & Install Base Packages
    # -------------------------------------------------------------------------
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    # Only packages that setup actually installs are recorded, so teardown never
    # removes software that was present before setup (merged across runs).
    - name: Record packages installed by setup
      ansible.builtin.import_tasks: tasks/save-local-state.yml
      vars:
        local_state_name: base
        local_state_force: true
        local_state:
          installed_packages: >-
            {{ ((ansible_local['mikmakmuk_base']['installed_packages'] | default([]))
                + (base_packages | difference(ansible_facts['packages'] | list)))
                | unique | sort }}

    - name: Install common_packages and node_packages from inventory
      community.general.pacman:
        name: "{{ base_packages }}"
        state: present

    # -------------------------------------------------------------------------
    # 3. System Environment Drop-Ins
    # -------------------------------------------------------------------------
    - name: Ensure /etc/environment.d directory exists
      ansible.builtin.file:
        path: /etc/environment.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy iGPU DRI & OpenCL environment drop-in
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname }}/files/99-homelab-igpu-dri.conf"
        dest: /etc/environment.d/99-homelab-igpu-dri.conf
        owner: root
        group: root
        mode: "0644"
