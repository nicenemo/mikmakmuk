#!/usr/bin/env ansible-playbook
---
- name: "Cluster-Wide Storage Maintenance & TRIM Setup"
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Active File System TRIM
    # -------------------------------------------------------------------------
    - name: "Execute active fstrim across all mounted filesystems"
      ansible.builtin.command:
        cmd: "fstrim -av"
      register: fstrim_out
      changed_when: "'trimmed' in fstrim_out.stdout"

    - name: "Store local node TRIM facts"
      ansible.builtin.set_fact:
        node_trim_results: "{{ fstrim_out.stdout_lines | default([]) }}"

    # -------------------------------------------------------------------------
    # 2. Automated Maintenance (systemd fstrim.timer)
    # -------------------------------------------------------------------------
    - name: "Enable and start weekly fstrim.timer"
      ansible.builtin.systemd:
        name: fstrim.timer
        state: started
        enabled: true

    # -------------------------------------------------------------------------
    # 3. Cluster Summary Report
    # -------------------------------------------------------------------------
    - name: "Display Storage TRIM Summary"
      ansible.builtin.debug:
        msg: "{{ lookup('template', project_root ~ '/templates/trim_summary_report.j2').split('\n') }}"
      run_once: true
