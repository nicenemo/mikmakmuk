#!/usr/bin/env ansible-playbook
---
- name: Apply Kernel Command Line, Sysctl, and Module Configuration
  hosts: cluster_nodes
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Sysctl Runtime Optimizations
    # -------------------------------------------------------------------------
    - name: Ensure /etc/sysctl.d directory exists
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure kernel sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-homelab-kernel.conf
        reload: true
      loop:
        - { key: 'vm.max_map_count', value: '262144' }
        - { key: 'fs.file-max', value: '2097152' }
        - { key: 'net.core.somaxconn', value: '1024' }

    # -------------------------------------------------------------------------
    # 2. Kernel Command Line Drop-Ins (USB Autosuspend Disable)
    # -------------------------------------------------------------------------
    - name: Ensure /etc/cmdline.d directory exists
      ansible.builtin.file:
        path: /etc/cmdline.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy kernel command-line parameters from external file
      ansible.builtin.copy:
        src: files/homelab-tuning.conf
        dest: /etc/cmdline.d/homelab-tuning.conf
        owner: root
        group: root
        mode: '0644'
      notify: Regenerate initramfs

    # -------------------------------------------------------------------------
    # 3. Kernel Module Configuration
    # -------------------------------------------------------------------------
    - name: Ensure i915 iGPU module configuration is set to load at boot
      ansible.builtin.copy:
        src: files/igpu.conf
        dest: /etc/modules-load.d/igpu.conf
        owner: root
        group: root
        mode: '0644'

    - name: Load i915 kernel module
      community.general.modprobe:
        name: i915
        state: present

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------
  handlers:
    - name: Regenerate initramfs
      ansible.builtin.command:
        cmd: mkinitcpio -P
      changed_when: true
