#!/usr/bin/env ansible-playbook
---
- name: Apply Kernel Command Line and Performance Optimizations (Limine)
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    tuning_cmdline: "{{ lookup('ansible.builtin.file', project_root ~ '/files/homelab-tuning.conf') | trim }}"
    tuning_tokens: "{{ (lookup('ansible.builtin.file', project_root ~ '/files/homelab-tuning.conf') | trim).split() }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Environment & Remote Tmp Fix
    # -------------------------------------------------------------------------
    - name: Ensure Ansible remote_tmp directory exists with correct permissions
      ansible.builtin.file:
        path: /root/.ansible/tmp
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Ensure /etc/environment.d directory exists
      ansible.builtin.file:
        path: /etc/environment.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy persistent iGPU hardware DRI and OpenCL environment drop-in
      ansible.builtin.copy:
        content: |
          MESA_LOADER_DRIVER_OVERRIDE=iris
          LIBGL_ALWAYS_SOFTWARE=0
          RUSTICL_ENABLE=iris
        dest: /etc/environment.d/99-homelab-igpu-dri.conf
        owner: root
        group: root
        mode: '0644'

    # -------------------------------------------------------------------------
    # 2. Kernel Discovery & Facts
    # -------------------------------------------------------------------------
    - name: Find target module directory for linux-cachyos
      ansible.builtin.find:
        paths: /usr/lib/modules
        file_type: directory
        patterns: "*cachyos*"
        excludes: "*lts*"
      register: kernel_module_dirs

    - name: Extract target kernel release string
      ansible.builtin.set_fact:
        intended_kernel: "{{ kernel_module_dirs.files | map(attribute='path') | map('basename') | sort | last }}"
      when: kernel_module_dirs.files | length > 0

    # -------------------------------------------------------------------------
    # 3. Clean Legacy Drop-Ins & Power Daemons
    # -------------------------------------------------------------------------
    - name: Disable conflicting power management daemons
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - power-profiles-daemon
        - auto-cpufreq
        - tlp
        - powertop
      failed_when: false

    - name: Remove leftover cmdline.d drop-ins
      ansible.builtin.file:
        path: /etc/cmdline.d/homelab-tuning.conf
        state: absent

    # -------------------------------------------------------------------------
    # 4. Update /etc/default/limine & Inspect Live State
    # -------------------------------------------------------------------------
    - name: Read current /etc/default/limine content
      ansible.builtin.command: cat /etc/default/limine
      register: limine_default_file
      changed_when: false

    - name: Append performance parameters to KERNEL_CMDLINE[default] in /etc/default/limine
      ansible.builtin.replace:
        path: /etc/default/limine
        regexp: '^(KERNEL_CMDLINE\[default\]\+=")(.*)"$'
        replace: '\1\2 {{ tuning_cmdline }}"'
      when: tuning_tokens[0] not in limine_default_file.stdout
      register: limine_cmdline_updated

    - name: Ensure BOOT_ORDER prioritizes main CachyOS kernel
      ansible.builtin.lineinfile:
        path: /etc/default/limine
        regexp: '^BOOT_ORDER=.*'
        line: 'BOOT_ORDER="*cachyos, *, *lts, *fallback, Snapshots"'
        create: true
        mode: '0644'
      register: limine_order_updated

    - name: Read live running /proc/cmdline
      ansible.builtin.command: cat /proc/cmdline
      register: proc_cmdline_check
      changed_when: false

    - name: Read current /boot/limine.conf content
      ansible.builtin.command: cat /boot/limine.conf
      register: limine_conf_check
      changed_when: false

    # Dynamically determine if running /proc/cmdline is missing any tuning tokens
    - name: Check for missing tokens in running kernel command line
      ansible.builtin.set_fact:
        missing_tuning_tokens: "{{ tuning_tokens | reject('in', proc_cmdline_check.stdout) | list }}"

    - name: Determine if reboot is strictly required
      ansible.builtin.set_fact:
        requires_reboot: >-
          {{ (limine_cmdline_updated.changed | default(false)) or
             (limine_order_updated.changed | default(false)) or
             (missing_tuning_tokens | length > 0) or
             ('default_entry: CachyOS/linux-cachyos' not in limine_conf_check.stdout) }}

    # -------------------------------------------------------------------------
    # 5. Rebuild Bootloader Architecture (Order Matters)
    # -------------------------------------------------------------------------
    - name: Rebuild initramfs images for all installed kernels
      ansible.builtin.command:
        cmd: mkinitcpio -P
      changed_when: true
      when: requires_reboot | bool

    - name: Regenerate Limine entries via limine-entry-tool
      ansible.builtin.command:
        cmd: limine-entry-tool
      changed_when: true
      when: requires_reboot | bool

    - name: Disable remember_last_entry in /boot/limine.conf AFTER regeneration
      ansible.builtin.replace:
        path: /boot/limine.conf
        regexp: '^\s*remember_last_entry\s*:\s*.*$'
        replace: 'remember_last_entry: no'
      when: requires_reboot | bool

    - name: Ensure default_entry is explicitly set in /boot/limine.conf AFTER regeneration
      ansible.builtin.lineinfile:
        path: /boot/limine.conf
        regexp: '^\s*default_entry\s*:.*$'
        line: 'default_entry: CachyOS/linux-cachyos'
        insertafter: '^timeout:'
        state: present
      when: requires_reboot | bool

    # -------------------------------------------------------------------------
    # 6. CPU Governor, EPP, Modules & Sysctl Optimizations
    # -------------------------------------------------------------------------
    - name: Ensure cpupower package is installed
      community.general.pacman:
        name: cpupower
        state: present

    - name: Apply immediate performance governor and EPP across all cores
      ansible.builtin.shell:
        cmd: |
          for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -f "$gov" ] && echo performance > "$gov"
          done
          for epp in /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference; do
            [ -f "$epp" ] && echo performance > "$epp"
          done
      changed_when: false

    - name: Deploy persistent CPU performance systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Set CPU Governor and EPP to Performance Mode
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do [ -f "$g" ] && echo performance > "$g"; done; for e in /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference; do [ -f "$e" ] && echo performance > "$e"; done'

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/cpu-performance.service
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start cpu-performance service
      ansible.builtin.systemd:
        name: cpu-performance
        enabled: true
        state: started
        daemon_reload: true

    - name: Deploy sysctl performance configuration
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-homelab-performance.conf"
        dest: /etc/sysctl.d/99-homelab-performance.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload sysctl

    - name: Ensure iGPU module is configured to load at boot
      ansible.builtin.copy:
        content: "i915\n"
        dest: /etc/modules-load.d/igpu.conf
        owner: root
        group: root
        mode: '0644'

    - name: Load i915 kernel module
      community.general.modprobe:
        name: i915
        state: present

    # -------------------------------------------------------------------------
    # 7. Automatic Reboot & Post-Boot Verification
    # -------------------------------------------------------------------------
    - name: Reboot system into new optimized kernel
      ansible.builtin.reboot:
        msg: "Rebooting automatically to apply Limine performance parameters into /proc/cmdline"
        connect_timeout: 10
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 5
        test_command: uptime
      when: requires_reboot | bool

    - name: Get running kernel version
      ansible.builtin.command:
        cmd: uname -r
      register: active_kernel
      changed_when: false

    - name: Read live running kernel command line (/proc/cmdline) post-reboot
      ansible.builtin.command:
        cmd: cat /proc/cmdline
      register: live_cmdline
      changed_when: false

    - name: Verify running kernel is linux-cachyos
      ansible.builtin.assert:
        that:
          - "'lts' not in active_kernel.stdout"
          - "'cachyos' in active_kernel.stdout"
        fail_msg: "Failed to boot into optimized kernel. Active kernel: {{ active_kernel.stdout }}"
        success_msg: "Successfully booted into optimized kernel: {{ active_kernel.stdout }}"

    - name: Verify all performance parameters are active in /proc/cmdline post-reboot
      ansible.builtin.assert:
        that:
          - item in live_cmdline.stdout
        fail_msg: "Post-reboot verification failed! Missing parameter in /proc/cmdline: {{ item }}"
        success_msg: "Verified {{ item }} is active in running /proc/cmdline"
      loop: "{{ tuning_tokens }}"

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
