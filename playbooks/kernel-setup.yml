#!/usr/bin/env ansible-playbook
---
- name: Apply Kernel Command Line and Performance Optimizations (Limine)
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir | dirname }}"
    tuning_tokens: "{{ (lookup('ansible.builtin.file', project_root ~ '/files/homelab-tuning.conf') | trim).split() }}"
    limine_boot_order: 'BOOT_ORDER="*cachyos, *, *lts, *fallback, Snapshots"'
    limine_default_entry: "CachyOS/linux-cachyos"
    # Single source for sysctl tuning: "key = value" lines in files/99-homelab-performance.conf
    homelab_sysctl: >-
      {{ lookup('ansible.builtin.file', project_root ~ '/files/99-homelab-performance.conf').splitlines()
          | map('trim') | reject('match', '(#|$)') | map('split', '=', 1)
          | map('map', 'trim') | map('list') | community.general.dict }}
    conflicting_power_services:
      - power-profiles-daemon.service
      - auto-cpufreq.service
      - tlp.service
      - powertop.service

  tasks:
    # -------------------------------------------------------------------------
    # 1. Environment & Remote Tmp Fix
    # -------------------------------------------------------------------------
    - name: Ensure Ansible remote_tmp directory exists with correct permissions
      ansible.builtin.file:
        path: /root/.ansible/tmp
        state: directory
        owner: root
        group: root
        mode: "0700"

    # -------------------------------------------------------------------------
    # 2. Inspect Current Bootloader, Kernel & Power State
    # -------------------------------------------------------------------------
    - name: Read current boot and power configuration
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/default/limine
        - /boot/limine.conf
        - /proc/cmdline
        - /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
        - /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference
      register: kernel_files_raw

    - name: Decode current boot and power configuration
      ansible.builtin.set_fact:
        limine_default_content: "{{ kernel_files_raw.results[0].content | b64decode }}"
        limine_conf_content: "{{ kernel_files_raw.results[1].content | b64decode }}"
        proc_cmdline_tokens: "{{ (kernel_files_raw.results[2].content | b64decode).split() }}"
        current_governor: "{{ kernel_files_raw.results[3].content | b64decode | trim }}"
        current_epp: "{{ kernel_files_raw.results[4].content | b64decode | trim }}"

    - name: Determine configured kernel command line tokens
      ansible.builtin.set_fact:
        limine_cmdline_tokens: >-
          {{ (limine_default_content | regex_findall('(?m)^KERNEL_CMDLINE\[default\]\+="(.*)"$')
              | first | default('')).split() }}

    - name: Record original bootloader and power state for teardown
      ansible.builtin.import_tasks: tasks/save-local-state.yml
      vars:
        local_state_name: kernel
        local_state:
          boot_order: >-
            {{ limine_default_content | regex_findall('(?m)^BOOT_ORDER=.*$') | first | default(none) }}
          scaling_governor: "{{ current_governor }}"
          energy_performance_preference: "{{ current_epp }}"

    # -------------------------------------------------------------------------
    # 3. Disable Conflicting Power Daemons
    # -------------------------------------------------------------------------
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Disable conflicting power management daemons that are installed
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ conflicting_power_services | select('in', ansible_facts['services']) | list }}"

    - name: Remove leftover cmdline.d drop-ins from earlier versions
      ansible.builtin.file:
        path: /etc/cmdline.d/homelab-tuning.conf
        state: absent

    # -------------------------------------------------------------------------
    # 4. Update /etc/default/limine
    # -------------------------------------------------------------------------
    - name: Append missing tuning parameters to KERNEL_CMDLINE[default]
      ansible.builtin.replace:
        path: /etc/default/limine
        regexp: '^(KERNEL_CMDLINE\[default\]\+=")(.*)"$'
        replace: '\1\2 {{ missing_limine_tokens | join(" ") }}"'
      vars:
        missing_limine_tokens: "{{ tuning_tokens | reject('in', limine_cmdline_tokens) | list }}"
      when: missing_limine_tokens | length > 0
      register: limine_cmdline_updated

    - name: Ensure BOOT_ORDER prioritizes main CachyOS kernel
      ansible.builtin.lineinfile:
        path: /etc/default/limine
        regexp: "^BOOT_ORDER=.*"
        line: "{{ limine_boot_order }}"
        create: true
        mode: "0644"
      register: limine_order_updated

    - name: Determine if bootloader regeneration and reboot are required
      ansible.builtin.set_fact:
        requires_reboot: >-
          {{ (limine_cmdline_updated is changed)
              or (limine_order_updated is changed)
              or (tuning_tokens | difference(proc_cmdline_tokens) | length > 0)
              or (('default_entry: ' ~ limine_default_entry) not in limine_conf_content) }}

    # -------------------------------------------------------------------------
    # 5. Rebuild Bootloader Entries (Order Matters)
    # -------------------------------------------------------------------------
    - name: Rebuild initramfs images for all installed kernels
      ansible.builtin.command:
        cmd: mkinitcpio -P
      changed_when: true
      when: requires_reboot | bool

    - name: Regenerate Limine entries via limine-entry-tool
      ansible.builtin.command:
        cmd: limine-entry-tool
      changed_when: true
      when: requires_reboot | bool

    - name: Disable remember_last_entry in /boot/limine.conf after regeneration
      ansible.builtin.replace:
        path: /boot/limine.conf
        regexp: '^\s*remember_last_entry\s*:\s*.*$'
        replace: "remember_last_entry: no"
      when: requires_reboot | bool

    - name: Ensure default_entry is explicitly set in /boot/limine.conf after regeneration
      ansible.builtin.lineinfile:
        path: /boot/limine.conf
        regexp: '^\s*default_entry\s*:.*$'
        line: "default_entry: {{ limine_default_entry }}"
        insertafter: "^timeout:"
        state: present
      when: requires_reboot | bool

    # -------------------------------------------------------------------------
    # 6. CPU Governor, EPP, Modules & Sysctl Optimizations
    # -------------------------------------------------------------------------
    - name: Deploy performance governor tmpfiles.d drop-in (applied at every boot)
      ansible.builtin.copy:
        src: "{{ project_root }}/files/homelab-cpu-performance.conf"
        dest: /etc/tmpfiles.d/homelab-cpu-performance.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply CPU performance governor

    - name: Apply sysctl performance settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-homelab-performance.conf
        state: present
        reload: true
      loop: "{{ homelab_sysctl | dict2items }}"
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"

    - name: Ensure iGPU module is configured to load at boot
      ansible.builtin.copy:
        content: "i915\n"
        dest: /etc/modules-load.d/igpu.conf
        owner: root
        group: root
        mode: "0644"

    - name: Load i915 kernel module
      community.general.modprobe:
        name: i915
        state: present

    - name: Apply the performance governor before rebooting
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # 7. Automatic Reboot & Post-Boot Verification
    # -------------------------------------------------------------------------
    - name: Reboot system into new optimized kernel
      ansible.builtin.reboot:
        msg: "Rebooting automatically to apply Limine performance parameters into /proc/cmdline"
        connect_timeout: 10
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 5
        test_command: uptime
      when: requires_reboot | bool

    - name: Read running kernel command line after reboot
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: live_cmdline_raw

    - name: Refresh running kernel facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - platform

    - name: Verify running kernel is linux-cachyos
      ansible.builtin.assert:
        that:
          - "'lts' not in ansible_facts['kernel']"
          - "'cachyos' in ansible_facts['kernel']"
        fail_msg: "Failed to boot into optimized kernel. Active kernel: {{ ansible_facts['kernel'] }}"
        success_msg: "Successfully booted into optimized kernel: {{ ansible_facts['kernel'] }}"

    - name: Read active CPU governor
      ansible.builtin.slurp:
        src: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
      register: live_governor_raw

    - name: Verify performance governor is active
      ansible.builtin.assert:
        that:
          - (live_governor_raw.content | b64decode | trim) == 'performance'
        fail_msg: "CPU governor is {{ live_governor_raw.content | b64decode | trim }}, expected performance"
        quiet: true

    - name: Verify all performance parameters are active in /proc/cmdline
      ansible.builtin.assert:
        that:
          - tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | length == 0
        fail_msg: >-
          Missing parameters in /proc/cmdline:
          {{ tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | join(' ') }}
        success_msg: "All {{ tuning_tokens | length }} tuning parameters are active in /proc/cmdline"

  handlers:
    - name: Apply CPU performance governor
      ansible.builtin.command:
        cmd: systemd-tmpfiles --create /etc/tmpfiles.d/homelab-cpu-performance.conf
      changed_when: true
