#!/usr/bin/env ansible-playbook
---
- name: Apply Kernel Command Line and Max Performance Optimization
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Disable PowerTOP (Prevents PowerTOP from overriding performance tunings)
    # -------------------------------------------------------------------------
    - name: Disable and stop PowerTOP auto-tune service if present
      ansible.builtin.systemd:
        name: powertop
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove legacy PowerTOP systemd service unit
      ansible.builtin.file:
        path: /etc/systemd/system/powertop.service
        state: absent

    # -------------------------------------------------------------------------
    # 2. Kernel Command Line Drop-Ins & Tuning
    # -------------------------------------------------------------------------
    - name: Ensure /etc/cmdline.d directory exists
      ansible.builtin.file:
        path: /etc/cmdline.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure hardware kernel tuning drop-in
      ansible.builtin.copy:
        src: "{{ project_root }}/files/homelab-tuning.conf"
        dest: /etc/cmdline.d/homelab-tuning.conf
        owner: root
        group: root
        mode: '0644'
      notify: Regenerate initramfs

    # -------------------------------------------------------------------------
    # 3. CPU EPP Performance Override
    # -------------------------------------------------------------------------
    - name: Force CPU EPP profile to performance
      ansible.builtin.shell:
        cmd: "echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference"
      changed_when: false

    # -------------------------------------------------------------------------
    # 4. Deploy Sysctl Performance Tuning
    # -------------------------------------------------------------------------
    - name: Deploy sysctl performance configuration file
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-homelab-performance.conf"
        dest: /etc/sysctl.d/99-homelab-performance.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload sysctl

    # -------------------------------------------------------------------------
    # 5. Kernel Module Loading
    # -------------------------------------------------------------------------
    - name: Ensure i915 module is set to load at boot
      ansible.builtin.copy:
        src: "{{ project_root }}/files/igpu.conf"
        dest: /etc/modules-load.d/igpu.conf
        owner: root
        group: root
        mode: '0644'

    - name: Load i915 module
      community.general.modprobe:
        name: i915
        state: present

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------
  handlers:
    - name: Regenerate initramfs
      ansible.builtin.command: mkinitcpio -P
      changed_when: true

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
