#!/usr/bin/env ansible-playbook
---
- name: "Safely Update Btrfs Mount Options in /etc/fstab (CachyOS)"
  hosts: cluster_nodes
  become: true
  vars:
    # Default fallback options if node variable is omitted
    default_btrfs_mount_opts: "noatime,compress=zstd:1,space_cache=v2"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Discover Root Filesystem & Record Original Options
    # -------------------------------------------------------------------------
    - name: Discover Btrfs root filesystem
      ansible.builtin.import_tasks: tasks/fstab-root-mount.yml

    - name: Record original root mount options for teardown
      ansible.builtin.import_tasks: tasks/save-local-state.yml
      vars:
        local_state_name: fstab
        local_state:
          root_opts: "{{ root_fstab_opts }}"

    # -------------------------------------------------------------------------
    # 2. Update /etc/fstab (subvolume options are always preserved)
    # -------------------------------------------------------------------------
    - name: Update root Btrfs mount options in /etc/fstab
      ansible.posix.mount:
        path: /
        src: "UUID={{ root_uuid }}"
        fstype: btrfs
        opts: >-
          {{ (root_subvol_opts + (btrfs_mount_opts | default(default_btrfs_mount_opts)).split(','))
              | unique | join(',') }}
        state: present
        backup: true
      notify: Remount root filesystem

    - name: Apply root remount when fstab changed
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # 3. Validation
    # -------------------------------------------------------------------------
    - name: Verify /etc/fstab syntax with findmnt
      ansible.builtin.command: "findmnt --verify --verbose"
      changed_when: false

    - name: Refresh mount facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - mounts

    - name: Display updated active mount configuration
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "UUID: {{ root_uuid }}"
          - "Configured Options: {{ btrfs_mount_opts | default(default_btrfs_mount_opts) }}"
          - "Active Mount Options: {{ root_active_mount['options'] }}"
      vars:
        root_active_mount: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"

  handlers:
    - name: Remount root filesystem
      ansible.posix.mount:
        path: /
        state: remounted
