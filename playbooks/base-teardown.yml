#!/usr/bin/env ansible-playbook
---
- name: Revert Base System Optimizations and Configuration
  hosts: cluster_nodes
  become: true

  tasks:
    - name: Stop and disable hardware management services
      ansible.builtin.systemd:
        name: powertop
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove PowerTOP systemd service unit
      ansible.builtin.file:
        path: /etc/systemd/system/powertop.service
        state: absent
      notify: Reload systemd daemon teardown

    - name: Remove common_packages and node_packages (excluding NetworkManager)
      community.general.pacman:
        name: "{{ ((common_packages | default([])) + (node_packages | default([]))) | reject('equalto', 'networkmanager') | list }}"
        state: absent

    - name: Remove standalone hardware and power tools
      community.general.pacman:
        name:
          - powertop
          - cpupower
        state: absent

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload systemd daemon teardown
      ansible.builtin.systemd:
        daemon_reload: true
