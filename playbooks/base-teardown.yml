#!/usr/bin/env ansible-playbook
---
- name: Revert Base System Optimizations and Configuration
  hosts: cluster_nodes
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Stop and Disable Services
    # -------------------------------------------------------------------------
    - name: Stop and disable hardware management services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - powertop
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Package Removal (Inventory & Driver Sets)
    # -------------------------------------------------------------------------
    - name: Remove common_packages and node_packages from inventory
      community.general.pacman:
        name: "{{ (common_packages | default([])) + (node_packages | default([])) }}"
        state: absent

    - name: Remove standalone hardware and power tools
      community.general.pacman:
        name:
          - powertop
          - cpupower
        state: absent

    # -------------------------------------------------------------------------
    # 3. Configuration & Systemd Unit Cleanup
    # -------------------------------------------------------------------------
    - name: Remove PowerTOP systemd service unit
      ansible.builtin.file:
        path: /etc/systemd/system/powertop.service
        state: absent
      notify: Reload systemd daemon teardown

    - name: Remove iGPU load module file
      ansible.builtin.file:
        path: /etc/modules-load.d/igpu.conf
        state: absent

    - name: Remove homelab cmdline kernel tuning configuration
      ansible.builtin.file:
        path: /etc/cmdline.d/homelab-tuning.conf
        state: absent
      notify: Regenerate initramfs teardown

    # -------------------------------------------------------------------------
    # 4. Flush Handlers
    # -------------------------------------------------------------------------
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

  # ---------------------------------------------------------------------------
  # Handlers (Executed at end of play)
  # ---------------------------------------------------------------------------
  handlers:
    - name: Reload systemd daemon teardown
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Regenerate initramfs teardown
      ansible.builtin.command: mkinitcpio -P
      changed_when: true
