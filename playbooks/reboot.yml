#!/usr/bin/env ansible-playbook
---
- name: Reboot Cluster Nodes
  hosts: cluster_nodes
  become: true
  serial: 1 # Reboots nodes one at a time to preserve cluster availability

  tasks:
    - name: Issue reboot and wait for host to return
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible maintenance playbook"
        connect_timeout: 5
        pre_reboot_delay: 2
        post_reboot_delay: 10
        reboot_timeout: 300
