#!/usr/bin/env ansible-playbook
---
- name: Benchmark CPU and memory performance with thermal audit
  hosts: cluster_nodes
  become: true
  vars_files:
    - vars/benchmark.yml
  vars:
    cpu_sysbench_duration_s: 10
    cpu_sysbench_max_prime: 20000
    cpu_stress_duration_s: 60
    cpu_stress_method: matrixprod

  tasks:
    # -------------------------------------------------------------------------
    # 1. Dependencies & Idle Baseline
    # -------------------------------------------------------------------------
    - name: Install CPU benchmark tooling
      community.general.pacman:
        name: "{{ benchmark_tool_packages.cpu + ['lm_sensors'] }}"
        state: present

    - name: Read idle temperatures
      ansible.builtin.import_tasks: tasks/read-sensors.yml

    - name: Record idle temperatures
      ansible.builtin.set_fact:
        cpu_temps_idle: "{{ sensor_temps }}"

    - name: Refresh node clock facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - date_time

    - name: Record benchmark start time
      ansible.builtin.set_fact:
        cpu_start_epoch: "{{ ansible_facts['date_time']['epoch'] }}"

    # -------------------------------------------------------------------------
    # 2. CPU Single & Multi-Threaded Performance (sysbench)
    # -------------------------------------------------------------------------
    - name: Run single-thread CPU benchmark (sysbench)
      ansible.builtin.command:
        cmd: >-
          sysbench cpu --threads=1 --cpu-max-prime={{ cpu_sysbench_max_prime }}
          --time={{ cpu_sysbench_duration_s }} run
      register: cpu_single_raw
      changed_when: false

    - name: Run multi-thread CPU benchmark (sysbench)
      ansible.builtin.command:
        cmd: >-
          sysbench cpu --threads={{ ansible_facts['processor_vcpus'] }} --cpu-max-prime={{ cpu_sysbench_max_prime }}
          --time={{ cpu_sysbench_duration_s }} run
      register: cpu_multi_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. Sustained Compute & Thermal Stress (stress-ng YAML metrics)
    # -------------------------------------------------------------------------
    - name: Run sustained stress-ng compute load and capture metrics
      block:
        - name: Create temporary stress-ng metrics file
          ansible.builtin.tempfile:
            state: file
            suffix: .stress-ng.yaml
          register: cpu_stress_metrics_file

        - name: Run sustained all-core stress-ng load
          ansible.builtin.command:
            cmd: >-
              stress-ng --cpu {{ ansible_facts['processor_vcpus'] }} --cpu-method {{ cpu_stress_method }}
              --timeout {{ cpu_stress_duration_s }}s --metrics-brief --yaml {{ cpu_stress_metrics_file.path }}
          changed_when: false

        - name: Read stress-ng metrics
          ansible.builtin.slurp:
            src: "{{ cpu_stress_metrics_file.path }}"
          register: cpu_stress_metrics_raw

      always:
        - name: Remove temporary stress-ng metrics file
          ansible.builtin.file:
            path: "{{ cpu_stress_metrics_file.path }}"
            state: absent
          when: cpu_stress_metrics_file.path is defined

    # -------------------------------------------------------------------------
    # 4. Memory Throughput (sysbench)
    # -------------------------------------------------------------------------
    - name: Run sequential memory read benchmark (sysbench)
      ansible.builtin.command:
        cmd: >-
          sysbench memory --threads={{ ansible_facts['processor_vcpus'] }}
          --memory-oper=read --memory-access-mode=seq run
      register: cpu_mem_read_raw
      changed_when: false

    - name: Run sequential memory write benchmark (sysbench)
      ansible.builtin.command:
        cmd: >-
          sysbench memory --threads={{ ansible_facts['processor_vcpus'] }}
          --memory-oper=write --memory-access-mode=seq run
      register: cpu_mem_write_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 5. Post-Test Thermal & Throttling Audit
    # -------------------------------------------------------------------------
    - name: Read post-test temperatures
      ansible.builtin.import_tasks: tasks/read-sensors.yml

    - name: Collect throttling events logged during the benchmark
      ansible.builtin.import_tasks: tasks/kernel-throttle-events.yml
      vars:
        throttle_since_epoch: "{{ cpu_start_epoch }}"

    # -------------------------------------------------------------------------
    # 6. Compile & Save Results
    # -------------------------------------------------------------------------
    - name: Parse stress-ng metrics
      ansible.builtin.set_fact:
        cpu_stress_metrics: >-
          {{ (cpu_stress_metrics_raw.content | b64decode | from_yaml).metrics
              | selectattr('stressor', 'equalto', 'cpu') | first }}

    - name: Compile CPU benchmark result
      ansible.builtin.set_fact:
        cpu_result:
          cpu_model: "{{ ansible_facts['processor'][2] | default(none) }}"
          logical_cpus: "{{ ansible_facts['processor_vcpus'] }}"
          sysbench_single_eps: >-
            {{ cpu_single_raw.stdout | regex_findall('events per second:\s+([0-9.]+)') | map('float') | first }}
          sysbench_multi_eps: >-
            {{ cpu_multi_raw.stdout | regex_findall('events per second:\s+([0-9.]+)') | map('float') | first }}
          stress_ng_method: "{{ cpu_stress_method }}"
          stress_ng_duration_s: "{{ cpu_stress_duration_s }}"
          stress_ng_bogo_ops_per_s: "{{ cpu_stress_metrics['bogo-ops-per-second-real-time'] | round(1) }}"
          memory_read_mib_s: >-
            {{ cpu_mem_read_raw.stdout | regex_findall('\(([0-9.]+) MiB/sec\)') | map('float') | first }}
          memory_write_mib_s: >-
            {{ cpu_mem_write_raw.stdout | regex_findall('\(([0-9.]+) MiB/sec\)') | map('float') | first }}
          cpu_temp_idle_c: "{{ cpu_temps_idle.cpu_package_c }}"
          cpu_temp_post_c: "{{ sensor_temps.cpu_package_c }}"
          nvme_temp_idle_c: "{{ cpu_temps_idle.nvme_c }}"
          nvme_temp_post_c: "{{ sensor_temps.nvme_c }}"
          throttle_event_count: "{{ throttle_events | length }}"
          throttle_events: "{{ throttle_events[-5:] }}"

    - name: Save CPU benchmark result
      ansible.builtin.import_tasks: tasks/save-benchmark-result.yml
      vars:
        benchmark_name: cpu
        benchmark_result: "{{ cpu_result }}"
