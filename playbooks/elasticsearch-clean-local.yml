#!/usr/bin/env ansible-playbook
---
- name: Clean Local Elasticsearch Download and Build Files
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    build_dir: "{{ project_root }}/build/elasticsearch"

  tasks:
    - name: Remove local Elasticsearch build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent

    - name: Confirm local cleanup completion
      ansible.builtin.debug:
        msg: "Local Elasticsearch build directory '{{ build_dir }}' successfully purged."
