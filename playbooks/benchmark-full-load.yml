#!/usr/bin/env ansible-playbook
---
- name: "Cluster Combined CPU + iGPU Parallel Stress & Thermal Benchmark"
  hosts: cluster_nodes
  become: true
  environment:
    MESA_LOADER_DRIVER_OVERRIDE: "iris"
    LIBGL_ALWAYS_SOFTWARE: "0"
    RUSTICL_ENABLE: "iris"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Ensure Stress & Sensor Tooling Is Installed
    # -------------------------------------------------------------------------
    - name: "Install stress-ng, clinfo, and thermal monitoring tools"
      community.general.pacman:
        name:
          - stress-ng
          - clinfo
          - lm_sensors
          - intel-gpu-tools
        state: present

    # -------------------------------------------------------------------------
    # 2. Baseline Pre-Test Thermal Readings
    # -------------------------------------------------------------------------
    - name: "Query Idle Core Temperature"
      ansible.builtin.shell:
        cmd: |
          sensors 2>/dev/null | grep -iE '(Package id 0|Core 0)' | head -n1 | awk '{print $4}' | tr -d '+°C' || echo 'N/A'
      register: temp_idle_raw
      changed_when: false

    - name: "Query CPU Frequency Scaling Governor & Max Frequency"
      ansible.builtin.shell:
        cmd: |
          gov=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo "unknown")
          gpu_freq=$(intel_gpu_frequency -g 2>/dev/null | sed -n -E 's/.*max:\s*([0-9]+)\s*MHz.*/\1/p' || echo "1100")
          echo "${gov} / GPU Max: ${gpu_freq} MHz"
      register: pwr_governor_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. Parallel CPU + GPGPU Simultaneous Stress (60 Seconds)
    # -------------------------------------------------------------------------
    - name: "Run Parallel CPU (6 Cores) + iGPU (RustiCL GPGPU) 60s Load"
      ansible.builtin.shell:
        cmd: |
          # Launch stress-ng with CPU matrix workers AND OpenCL GPU matrix worker in parallel
          stress-ng --cpu $(nproc) --cpu-method matrixprod \
                    --gpu 1 --gpu-method matrixprod \
                    --timeout 60s --metrics-brief > /tmp/parallel-stress.log 2>&1 &
          STRESS_PID=$!

          # Sample peak temperature halfway through the test (at 30s)
          sleep 30
          peak_temp=$(sensors 2>/dev/null | grep -iE '(Package id 0|Core 0)' | head -n1 | awk '{print $4}' | tr -d '+°C')
          echo "${peak_temp:-N/A}" > /tmp/peak_temp.txt

          # Wait for stress-ng to complete full 60s run
          wait $STRESS_PID || true
      changed_when: false

    # -------------------------------------------------------------------------
    # 4. Post-Test Telemetry & Throttling Checks
    # -------------------------------------------------------------------------
    - name: "Read Peak Load Core Temperature"
      ansible.builtin.command:
        cmd: cat /tmp/peak_temp.txt
      register: temp_peak_raw
      changed_when: false

    - name: "Query Post-Test Core Temperature (Cooldown Check)"
      ansible.builtin.shell:
        cmd: |
          sensors 2>/dev/null | grep -iE '(Package id 0|Core 0)' | head -n1 | awk '{print $4}' | tr -d '+°C' || echo 'N/A'
      register: temp_post_raw
      changed_when: false

    - name: "Check Kernel dmesg for Thermal or Power Limitation Events"
      ansible.builtin.shell:
        cmd: |
          logs=$(dmesg | grep -iE '(i915|cpu|thermal|throttle|power limit|prochot)' | grep -iE '(downclock|throttl|limit|overtemp|pkg_thermtrip)' | tail -n2 | tr '\n' ' ' | tr -s ' ')
          echo "${logs:-None Detected}"
      register: throttling_logs_raw
      changed_when: false

    # -------------------------------------------------------------------------
    # 5. Compile Summary Telemetry Matrix
    # -------------------------------------------------------------------------
    - name: "Compile Combined Load Telemetry Facts"
      ansible.builtin.set_fact:
        parallel_load_summary:
          host_node: "{{ inventory_hostname.upper() }}"
          cpu_topology: "{{ ansible_facts['processor_vcpus'] | default(6) }} Cores (i5-8500T)"
          power_governor: "{{ pwr_governor_raw.stdout | trim }}"
          thermal_progression: "Idle: {{ temp_idle_raw.stdout | trim }} °C ➔ Peak (30s): {{ temp_peak_raw.stdout | trim }} °C ➔ Post-Test (60s): {{ temp_post_raw.stdout | trim }} °C"
          throttling_status: "{{ throttling_logs_raw.stdout | trim }}"

    - name: "Display Simultaneous CPU + iGPU Load Matrix"
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "       SIMULTANEOUS CPU + iGPU PARALLEL LOAD & THERMAL MATRIX"
          - "========================================================================="
          - "Host                     : {{ parallel_load_summary.host_node }}"
          - "CPU Topology             : {{ parallel_load_summary.cpu_topology }}"
          - "Power Configuration      : {{ parallel_load_summary.power_governor }}"
          - "Thermal Progression      : {{ parallel_load_summary.thermal_progression }}"
          - "Throttling & Power Logs  : {{ parallel_load_summary.throttling_status }}"
          - "-------------------------------------------------------------------------"
