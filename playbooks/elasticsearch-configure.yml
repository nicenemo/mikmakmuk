#!/usr/bin/env ansible-playbook
---
- name: Configure Elasticsearch Cluster over Dedicated & Management Networks
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    es_elastic_password: "{{ lookup('ansible.builtin.password', project_root ~ '/credentials/elastic_password.txt length=24 chars=ascii_letters,digits') }}"

  tasks:
    - name: End play for nodes without the elasticsearch_node role
      ansible.builtin.meta: end_host
      when: "'elasticsearch_node' not in (cluster_roles | default([]))"

    # -------------------------------------------------------------------------
    # 1. Scoped Firewall Rules (UFW)
    # -------------------------------------------------------------------------
    - name: Allow Transport (9300) strictly from peer 2.5 GbE cluster IPs
      community.general.ufw:
        rule: allow
        port: '9300'
        proto: tcp
        from_ip: "{{ hostvars[item]['cluster_ip'] }}"
        comment: "ES Transport from {{ item }}"
      loop: "{{ groups['cluster_nodes'] }}"
      when: "'elasticsearch_node' in (hostvars[item]['cluster_roles'] | default([]))"

    - name: Allow REST API (9200) strictly from management subnet
      community.general.ufw:
        rule: allow
        port: '9200'
        proto: tcp
        from_ip: "{{ elasticsearch_ip.split('.')[0:3] | join('.') }}.0/24"
        comment: "ES REST API on management LAN"

    - name: Enable UFW state
      community.general.ufw:
        state: enabled

    - name: Ensure UFW service is active and enabled at boot
      ansible.builtin.systemd:
        name: ufw
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. Setup Directories & Deploy Configurations
    # -------------------------------------------------------------------------
    - name: Check if Elasticsearch node data is initialized
      ansible.builtin.stat:
        path: /var/lib/elasticsearch/nodes
      register: es_data_state

    - name: Ensure configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: '0750'
      loop:
        - /etc/elasticsearch
        - /etc/elasticsearch/jvm.options.d

    - name: Deploy JVM heap options configuration
      ansible.builtin.template:
        src: "{{ project_root }}/templates/jvm_heap.options.j2"
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        owner: elasticsearch
        group: elasticsearch
        mode: '0640'
      notify: Restart Elasticsearch

    - name: Deploy Elasticsearch configuration template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/elasticsearch.yml.j2"
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: elasticsearch
        group: elasticsearch
        mode: '0660'
      vars:
        node_is_bootstrapped: "{{ es_data_state.stat.exists | default(false) }}"
      notify: Restart Elasticsearch

    - name: Ensure correct ownership on Elasticsearch directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: elasticsearch
        group: elasticsearch
        state: directory
        recurse: true
      loop:
        - /etc/elasticsearch
        - /var/lib/elasticsearch
        - /var/log/elasticsearch

    - name: Enable and start Elasticsearch service
      ansible.builtin.systemd:
        name: elasticsearch
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers to process Elasticsearch restarts immediately
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    # 3. Non-Ping Socket Verification on Management IP
    # -------------------------------------------------------------------------
    - name: Wait for TCP port 9200 to start listening on elasticsearch_ip
      ansible.builtin.wait_for:
        host: "{{ elasticsearch_ip }}"
        port: 9200
        state: started
        delay: 5
        timeout: 60

    - name: Check if generated elastic password is already active
      ansible.builtin.uri:
        url: "https://{{ elasticsearch_ip }}:9200/_cluster/health"
        user: elastic
        password: "{{ es_elastic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_auth_check
      ignore_errors: true
      run_once: true

    - name: Set elastic user password on cluster
      ansible.builtin.shell: >
        printf "%s\n%s\n" "{{ es_elastic_password }}" "{{ es_elastic_password }}" |
        /usr/share/elasticsearch/bin/elasticsearch-reset-password
        --username elastic
        --url "https://{{ elasticsearch_ip }}:9200"
        --interactive
        --batch
      when: es_auth_check.status is not defined or es_auth_check.status != 200
      run_once: true

    - name: Verify Elasticsearch cluster health endpoint over management network
      ansible.builtin.uri:
        url: "https://{{ elasticsearch_ip }}:9200/_cluster/health"
        method: GET
        user: elastic
        password: "{{ es_elastic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_health_check
      until: es_health_check.status is defined and es_health_check.status == 200
      retries: 24
      delay: 5

    # -------------------------------------------------------------------------
    # 4. Homelab Unredacted Credentials Output
    # -------------------------------------------------------------------------
    - name: Display cluster health and unredacted credentials
      ansible.builtin.shell: >
        echo "==========================================================" &&
        echo "Elasticsearch Node {{ inventory_hostname }} is HEALTHY!" &&
        echo "REST API IP: {{ elasticsearch_ip }}" &&
        echo "Transport Cluster IP: {{ cluster_ip }}" &&
        echo "Cluster Status: {{ es_health_check.json.status }}" &&
        echo "Number of Nodes: {{ es_health_check.json.number_of_nodes }}" &&
        echo "" &&
        echo "Elasticsearch 'elastic' user password:" &&
        echo "  {{ es_elastic_password }}" &&
        echo "" &&
        echo "Test command over management network:" &&
        echo "  curl -k -u elastic:{{ es_elastic_password }} https://{{ elasticsearch_ip }}:9200/_cluster/health?pretty" &&
        echo "=========================================================="
      changed_when: false

  handlers:
    - name: Restart Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted
