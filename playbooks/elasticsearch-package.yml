#!/usr/bin/env ansible-playbook
---
- name: Build CachyOS Elasticsearch Package.
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    # Fetches elk_version from inventory.yml (defaults to 9.5.3 if undefined)
    target_version: "{{ hostvars[groups['cluster_nodes'][0]]['elk_version'] if (groups['cluster_nodes'] is defined and hostvars[groups['cluster_nodes'][0]]['elk_version'] is defined) else '9.5.3' }}"
    build_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['env']['USER'] | default(lookup('ansible.builtin.env', 'USER'))) }}"

  tasks:
    - name: Set resolved version fact
      ansible.builtin.set_fact:
        resolved_elk_version: "{{ target_version }}"

    - name: Display active ELK version
      ansible.builtin.debug:
        msg: "Elasticsearch version to package: {{ resolved_elk_version }}"

    - name: Set path facts for local build
      ansible.builtin.set_fact:
        build_dir: "{{ project_root }}/build/elasticsearch"
        pkg_build_dir: "{{ project_root }}/build/elasticsearch/pkg_build"
        pkg_file_name: "elasticsearch-{{ resolved_elk_version }}-1-x86_64.pkg.tar.zst"

    - name: Check if CachyOS package already exists locally
      ansible.builtin.stat:
        path: "{{ build_dir }}/{{ pkg_file_name }}"
      register: local_pkg_stat

    - name: Ensure pkg_build directory exists with correct ownership
      ansible.builtin.file:
        path: "{{ pkg_build_dir }}"
        state: directory
        owner: "{{ build_user }}"
        group: "{{ build_user }}"
        mode: '0755'

    - name: Ensure build directories are owned by standard user
      ansible.builtin.file:
        path: "{{ build_dir }}"
        owner: "{{ build_user }}"
        group: "{{ build_user }}"
        recurse: true

    - name: Generate PKGBUILD file from template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/elasticsearch-pkg/PKGBUILD.j2"
        dest: "{{ pkg_build_dir }}/PKGBUILD"
        mode: '0644'
      vars:
        es_version: "{{ resolved_elk_version }}"

    - name: Copy downloaded tarball to pkg_build directory
      ansible.builtin.copy:
        src: "{{ build_dir }}/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz"
        dest: "{{ pkg_build_dir }}/elasticsearch-{{ resolved_elk_version }}-linux-x86_64.tar.gz"
      when: not local_pkg_stat.stat.exists

    - name: Build CachyOS package using makepkg as unprivileged user
      ansible.builtin.command:
        cmd: "makepkg -f --nodeps"
        chdir: "{{ pkg_build_dir }}"
      become: true
      become_user: "{{ build_user }}"
      when: not local_pkg_stat.stat.exists

    - name: Move built package to root build folder
      ansible.builtin.command:
        cmd: "mv {{ pkg_build_dir }}/{{ pkg_file_name }} {{ build_dir }}/{{ pkg_file_name }}"
      when: not local_pkg_stat.stat.exists
