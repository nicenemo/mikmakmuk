#!/usr/bin/env ansible-playbook
---
- name: "Dynamic N-Node Dual-Tier (1 GbE & 2.5 GbE) Cluster Network Benchmark"
  hosts: cluster_nodes
  become: true
  vars:
    # Resolve project root dynamically matching base-setup.yml path resolution
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Network Interface & IP Discovery
    # -------------------------------------------------------------------------
    - name: "Identify management interface and 1 GbE IP"
      ansible.builtin.set_fact:
        mgmt_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"
        mgmt_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

    - name: "Discover physical USB-C ethernet interface"
      ansible.builtin.set_fact:
        discovered_usb_iface: >-
          {{
            ansible_facts['interfaces']
            | reject('equalto', 'lo')
            | reject('equalto', mgmt_iface)
            | select('match', '^(eth|en|enp|wlx|usb).*')
            | list
            | first
          }}

    - name: "Extract clean 2.5 GbE IP address"
      ansible.builtin.set_fact:
        target_cluster_ip: "{{ (hostvars[inventory_hostname]['cluster_ip'] | default(hostvars[inventory_hostname]['vlan107_ip']) | default(ansible_facts[discovered_usb_iface]['ipv4']['address'])) | regex_replace('/.*$', '') }}"

    - name: "Run full-mesh benchmark execution block"
      block:
        # ---------------------------------------------------------------------
        # 2. Infrastructure & UFW Setup
        # ---------------------------------------------------------------------
        - name: "Allow iperf3 port 5201 in UFW"
          community.general.ufw:
            rule: allow
            port: "5201"
            proto: tcp
            comment: "Temporary iperf3 speedtest"

        - name: "Reload UFW to apply firewall rules"
          ansible.builtin.command: ufw reload
          changed_when: true

        # ---------------------------------------------------------------------
        # 3. Pass 1: 1 GbE Management Network Benchmark
        # ---------------------------------------------------------------------
        - name: "Ensure clean iperf3 state before 1 GbE pass"
          ansible.builtin.shell: "killall -9 iperf3 2>/dev/null || true"
          changed_when: false
          failed_when: false

        - name: "Start background iperf3 server daemon on 1 GbE interface"
          ansible.builtin.command: "iperf3 -s -D -B {{ mgmt_ip }}"
          changed_when: true

        - name: "Execute 1 GbE speed tests to all cluster peers"
          ansible.builtin.command: >
            iperf3 -c {{ hostvars[target_peer]['mgmt_ip'] }}
            -B {{ mgmt_ip }}
            -t 10 -P 4 --json
          when: inventory_hostname != target_peer
          loop: "{{ groups['cluster_nodes'] }}"
          loop_control:
            loop_var: target_peer
            label: "1 GbE: {{ inventory_hostname }} -> {{ target_peer }}"
          throttle: 1
          register: iperf_runs_1g
          changed_when: false

        - name: "Construct raw JSON string of 1 GbE test results"
          ansible.builtin.set_fact:
            node_results_1g_raw: >-
              [
                {% for item in iperf_runs_1g.results if not item.skipped | default(false) %}
                {
                  "network": "1 GbE",
                  "source": "{{ inventory_hostname }}",
                  "target": "{{ item.target_peer }}",
                  "src_ip": "{{ mgmt_ip }}",
                  "dst_ip": "{{ hostvars[item.target_peer]['mgmt_ip'] }}",
                  "gbps": {{ ((item.stdout | from_json).end.sum_sent.bits_per_second / 1000000000) | round(2) }}
                }{% if not loop.last %},{% endif %}
                {% endfor %}
              ]

        - name: "Cast 1 GbE results string to native Ansible list"
          ansible.builtin.set_fact:
            node_results_1g: "{{ node_results_1g_raw | from_json }}"

        # ---------------------------------------------------------------------
        # 4. Pass 2: 2.5 GbE Network Benchmark
        # ---------------------------------------------------------------------
        - name: "Stop 1 GbE daemons before starting 2.5 GbE pass"
          ansible.builtin.shell: "killall -9 iperf3 2>/dev/null || true"
          changed_when: false
          failed_when: false

        - name: "Start background iperf3 server daemon on 2.5 GbE interface"
          ansible.builtin.command: "iperf3 -s -D -B {{ target_cluster_ip }}"
          changed_when: true

        - name: "Execute 2.5 GbE speed tests to all cluster peers"
          ansible.builtin.command: >
            iperf3 -c {{ hostvars[target_peer]['target_cluster_ip'] }}
            -B {{ target_cluster_ip }}
            -t 10 -P 4 --json
          when: inventory_hostname != target_peer
          loop: "{{ groups['cluster_nodes'] }}"
          loop_control:
            loop_var: target_peer
            label: "2.5 GbE: {{ inventory_hostname }} -> {{ target_peer }}"
          throttle: 1
          register: iperf_runs_25g
          changed_when: false

        - name: "Construct raw JSON string of 2.5 GbE test results"
          ansible.builtin.set_fact:
            node_results_25g_raw: >-
              [
                {% for item in iperf_runs_25g.results if not item.skipped | default(false) %}
                {
                  "network": "2.5 GbE",
                  "source": "{{ inventory_hostname }}",
                  "target": "{{ item.target_peer }}",
                  "src_ip": "{{ target_cluster_ip }}",
                  "dst_ip": "{{ hostvars[item.target_peer]['target_cluster_ip'] }}",
                  "gbps": {{ ((item.stdout | from_json).end.sum_sent.bits_per_second / 1000000000) | round(2) }}
                }{% if not loop.last %},{% endif %}
                {% endfor %}
              ]

        - name: "Cast 2.5 GbE results string to native Ansible list"
          ansible.builtin.set_fact:
            node_results_25g: "{{ node_results_25g_raw | from_json }}"

        # ---------------------------------------------------------------------
        # 5. Combined Aggregation & Single Report Rendering
        # ---------------------------------------------------------------------
        - name: "Combine all node 1 GbE results across cluster on first node"
          ansible.builtin.set_fact:
            all_1g_results: "{{ groups['cluster_nodes'] | map('extract', hostvars, 'node_results_1g') | flatten }}"
          run_once: true

        - name: "Combine all node 2.5 GbE results across cluster on first node"
          ansible.builtin.set_fact:
            all_25g_results: "{{ groups['cluster_nodes'] | map('extract', hostvars, 'node_results_25g') | flatten }}"
          run_once: true

        - name: "Merge network tiers sequentially (1 GbE block first, 2.5 GbE block second)"
          ansible.builtin.set_fact:
            all_cluster_results: "{{ all_1g_results + all_25g_results }}"
          run_once: true

        - name: "Render and print unified benchmark summary table from template"
          ansible.builtin.debug:
            msg: "{{ lookup('template', project_root ~ '/templates/iperf_summary.j2').splitlines() }}"
          run_once: true

      # -----------------------------------------------------------------------
      # 6. Mandatory Teardown (Always Runs)
      # -----------------------------------------------------------------------
      always:
        - name: "Kill all iperf3 server daemons across cluster"
          ansible.builtin.shell: "killall -9 iperf3 2>/dev/null || true"
          changed_when: false
          failed_when: false

        - name: "Remove temporary iperf3 port 5201 rule from UFW"
          community.general.ufw:
            rule: delete allow port 5201 proto tcp
          failed_when: false

        - name: "Reload UFW firewall to restore original state"
          ansible.builtin.command: ufw reload
          failed_when: false
          changed_when: false
