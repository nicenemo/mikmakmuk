#!/usr/bin/env ansible-playbook
---
- name: "Cluster Storage TRIM Teardown & Maintenance Disable"
  hosts: cluster_nodes
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Stop and Disable Automated Maintenance Timer
    # -------------------------------------------------------------------------
    - name: "Stop and disable weekly fstrim.timer"
      ansible.builtin.systemd:
        name: fstrim.timer
        state: stopped
        enabled: false
      ignore_errors: true
      register: timer_disable_res

    # -------------------------------------------------------------------------
    # 2. Remove Systemd Service Drop-In Overrides
    # -------------------------------------------------------------------------
    - name: "Remove fstrim systemd override directory"
      ansible.builtin.file:
        path: /etc/systemd/system/fstrim.service.d
        state: absent
      register: override_remove_res

    - name: "Reload systemd daemon after configuration purge"
      ansible.builtin.systemd:
        daemon_reload: true
      when: override_remove_res.changed

    # -------------------------------------------------------------------------
    # 3. Compile & Display Teardown Summary
    # -------------------------------------------------------------------------
    - name: "Store local node teardown facts"
      ansible.builtin.set_fact:
        trim_teardown_status:
          timer_state: "{{ 'Disabled & Stopped' if not timer_disable_res.failed else 'Failed / Not Installed' }}"
          override_state: "{{ 'Removed' if override_remove_res.changed else 'Clean' }}"

    - name: "Display Storage TRIM Teardown Summary"
      ansible.builtin.debug:
        msg: "{{ lookup('template', project_root ~ '/templates/trim_teardown_report.j2').split('\n') }}"
      run_once: true
