#!/usr/bin/env ansible-playbook
---
- name: Uninstall Elasticsearch from Cluster Nodes
  hosts: cluster_nodes
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Stop and Disable Service
    # -------------------------------------------------------------------------
    - name: Ensure Elasticsearch service is stopped and disabled
      ansible.builtin.systemd:
        name: elasticsearch
        state: stopped
        enabled: false
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Uninstall CachyOS/Arch Package via Pacman
    # -------------------------------------------------------------------------
    - name: Uninstall Elasticsearch package via pacman
      community.general.pacman:
        name: elasticsearch
        state: absent

    # -------------------------------------------------------------------------
    # 3. Purge Leftover Directories & Data
    # -------------------------------------------------------------------------
    - name: Remove Elasticsearch configuration, log, and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/elasticsearch
        - /var/lib/elasticsearch
        - /var/log/elasticsearch
        - /usr/share/elasticsearch

    # -------------------------------------------------------------------------
    # 4. Remove Dedicated System User and Group
    # -------------------------------------------------------------------------
    - name: Remove elasticsearch user
      ansible.builtin.user:
        name: elasticsearch
        state: absent
        remove: true

    - name: Remove elasticsearch group
      ansible.builtin.group:
        name: elasticsearch
        state: absent
