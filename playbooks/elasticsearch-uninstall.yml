#!/usr/bin/env ansible-playbook
---
- name: Uninstall Elasticsearch from Cluster Nodes.
  hosts: cluster_nodes
  become: true
  tasks:
    - name: End play for nodes without the elasticsearch_node role
      ansible.builtin.meta: end_host
      when: "'elasticsearch_node' not in (cluster_roles | default([]))"
    - name: Ensure Elasticsearch service is stopped and disabled
      ansible.builtin.systemd:
        name: elasticsearch
        state: stopped
        enabled: false
      failed_when: false
    - name: Uninstall Elasticsearch package via pacman
      community.general.pacman:
        name: elasticsearch
        state: absent
    - name: Remove Elasticsearch configuration, log, and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/elasticsearch
        - /var/lib/elasticsearch
        - /var/log/elasticsearch
        - /usr/share/elasticsearch
    - name: Remove elasticsearch user
      ansible.builtin.user:
        name: elasticsearch
        state: absent
        remove: true
    - name: Remove elasticsearch group
      ansible.builtin.group:
        name: elasticsearch
        state: absent
