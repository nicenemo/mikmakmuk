# -----------------------------------------------------------------------------
# AGGREGATE RESULTS TO PRIMARY HOST (mik)
# -----------------------------------------------------------------------------
- name: "Share {{ target_node }} results to primary host"
  ansible.builtin.set_fact:
    matrix_results: "{{ hostvars[groups['cluster_nodes'][0]]['matrix_results'] | default({}) | combine({target_node: node_results}) }}"
  delegate_to: "{{ groups['cluster_nodes'][0] }}"
  delegate_facts: true
  when: inventory_hostname == target_node
