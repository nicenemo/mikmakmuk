---
# Included task file executing all 4 benchmark passes targeting `target_node`

- name: "Set target node details for {{ target_node }}"
  ansible.builtin.set_fact:
    target_ip: "{{ hostvars[target_node]['elasticsearch_ip'] }}"
    node_results: {}

# -----------------------------------------------------------------------------
# PASS 1: TINY DOCUMENTS (~200B)
# -----------------------------------------------------------------------------
- name: "Purge old tiny index for {{ target_node }}"
  ansible.builtin.uri:
    url: "https://{{ target_ip }}:9200/{{ test_index_tiny }}"
    method: DELETE
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  run_once: true

- name: "Setup tiny index for {{ target_node }}"
  ansible.builtin.uri:
    url: "https://{{ target_ip }}:9200/{{ test_index_tiny }}"
    method: PUT
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      settings:
        number_of_shards: 3
        number_of_replicas: 1
        refresh_interval: "1s"
    status_code: [200]
  run_once: true

- name: "Execute Pass 1 against {{ target_node }}"
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/es_benchmark_client.py
      --host "{{ target_ip }}"
      --port 9200
      --password "{{ es_elastic_password }}"
      --index "{{ test_index_tiny }}"
      --mode tiny
  register: res_pass1
  when: inventory_hostname == target_node
  changed_when: true

- name: "Record Pass 1 for {{ target_node }}"
  ansible.builtin.set_fact:
    node_results: "{{ node_results | combine({'pass1_tiny': (res_pass1.stdout | from_json)}) }}"
  when: inventory_hostname == target_node

