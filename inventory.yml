all:
  vars:
    bootstrap_user: kruse
    ansible_management_user: myansibleuser
    ansible_user: "{{ ansible_management_user }}"
    ansible_python_interpreter: /usr/bin/python3
    cluster_connection_name: "cluster-vlan107"
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
      - networkmanager
      - iperf3

  children:
    cluster_nodes:
      hosts:
        mik:
          ansible_host: 192.168.105.2
          ram_gb: 64
          cpu_type: 8500
          cluster_ip: 192.168.107.2
          node_packages:
            - rsync
            - tree
            - tmux

        mak:
          ansible_host: 192.168.105.3
          ram_gb: 32
          cpu_type: 8500T
          cluster_ip: 192.168.107.3
          node_packages:
            - htop
            - ncdu

        muk:
          ansible_host: 192.168.105.4
          ram_gb: 64
          cpu_type: 8500T
          cluster_ip: 192.168.107.4
          node_packages:
            - iotop
            - duf
