all:
  vars:
    bootstrap_user: kruse
    ansible_management_user: myansibleuser
    ansible_user: "{{ ansible_management_user }}"
    ansible_python_interpreter: /usr/bin/python3
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
      - networkmanager
    elk_version: 9.5.0

  children:
    cluster_nodes:
      hosts:
       mik:
         ansible_host: 192.168.105.2
         ram_gb: 64
         cpu_type: 8500
         node_packages:
           - rsync
           - tree
           - tmux

         elasticsearch_ip: 192.168.105.210/24
          cluster_roles:
            - elasticsearch_node

        mak:
          ansible_host: 192.168.105.3
          ram_gb: 32
          cpu_type: 8500T
          node_packages:
            - htop
            - ncdu

          elasticsearch_ip: 192.168.105.220/24
          kibana_ip: 192.168.105.221/24
          cluster_roles:
            - elasticsearch_node
            - kibana_node

       muk:
         ansible_host: 192.168.105.4
         ram_gb: 16
         cpu_type: 8500T
         node_packages:
           - iotop
           - duf

         elasticsearch_ip: 192.168.105.230/24
         cluster_roles:
           - elasticsearch_node
