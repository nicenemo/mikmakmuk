all:
  vars:
    ansible_user: myansibleuser
    bootstrap_user: kruse
    # Key used by Ansible for regular runs after bootstrapping:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
    ansible_python_interpreter: /usr/bin/python3
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
  children:
    cluster_nodes:
      hosts:
        mik:
          ansible_host: 192.168.105.2
          ram_gb: 64
          cpu_type: 8500
          cluster_roles:
            - control_plane
            - worker
          node_packages:
            - rsync
            - tree
            - tmux
        mak:
          ansible_host: 192.168.105.3
          ram_gb: 32
          cpu_type: 8500T
          cluster_roles:
            - worker
          node_packages:
            - htop
            - ncdu
        muk:
          ansible_host: 192.168.105.4
          ram_gb: 16
          cpu_type: 8500T
          cluster_roles:
            - worker
          node_packages:
            - iotop
            - duf
