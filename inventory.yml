#         elasticsearch_ip: 192.168.105.210/24
#         cluster_roles:
#           - elasticsearch_node
#         custom_sans:
#           - es01.bird.internal

        mak:
          ansible_host: 192.168.105.3
          ram_gb: 32
          cpu_type: 8500T
          node_packages:
            - htop
            - ncdu
          elasticsearch_ip: 192.168.105.3/24
          kibana_ip: 192.168.105.3/24
          cluster_roles:
            - elasticsearch_node
            - kibana_node
          custom_sans:
            - kibana.bird.internal
            - es02.bird.internal

          # Optional per-node overrides (uncomment if you ever want to force explicit limits):
          # es_heap_size_gb: 8
          # kibana_memory_mb: 4096

