all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
  children:
    cluster_nodes:
      hosts:
        mik:
          ansible_host: 192.168.105.2
          ansible_user: kruse
          ram_gb: 64
          cpu_type: 8500
          cluster_roles:
            - control_plane
            - worker
          node_packages:
            - rsync
            - tree
            - tmux
        mak:
          ansible_host: 192.168.105.3
          ansible_user: kruse
          ram_gb: 32
          cpu_type: 8500T
          cluster_roles:
            - worker
          node_packages:
            - htop
            - ncdu
