---
all:
  vars:
    bootstrap_user: kruse
    ansible_management_user: myansibleuser
    ansible_user: "{{ ansible_management_user }}"
    ansible_python_interpreter: /usr/bin/python3
    cluster_connection_name: "cluster-vlan107"
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
      - networkmanager
      - mesa
      - vulkan-intel
      - vulkan-icd-loader
      - intel-media-driver
      - libva-intel-driver
      - vulkan-tools
      - clinfo
      - intel-gpu-tools
      - lm_sensors
    # Benchmark-only tools are installed on demand by benchmark.yml
    # (see playbooks/vars/benchmark.yml) and removed by base-teardown.yml.

  children:
    cluster_nodes:
      hosts:
        mik:
          ansible_host: 192.168.105.2
          ram_gb: 32
          cpu_type: 8500
          cluster_ip: 192.168.107.2
          btrfs_mount_opts: "noatime,compress-force=zstd:1,space_cache=v2"
          node_packages:
            - rsync
            - tree
            - tmux

        # mak and muk are switched off on this branch (only mik is powered on for the Nachtgespenst work).
        # Remove the comment marks to bring them back.
        # mak:
        #   ansible_host: 192.168.105.3
        #   ram_gb: 64
        #   cpu_type: 8500T
        #   cluster_ip: 192.168.107.3
        #   btrfs_mount_opts: "noatime,compress=zstd:1,commit=15,space_cache=v2"
        #   node_packages:
        #     - htop
        #     - ncdu
        #
        # muk:
        #   ansible_host: 192.168.105.4
        #   ram_gb: 64
        #   cpu_type: 8500T
        #   cluster_ip: 192.168.107.4
        #   btrfs_mount_opts: "noatime,compress=zstd:3,space_cache=v2"
        #   node_packages:
        #     - iotop
        #     - duf

    # Only mik builds, flashes and tests the Nachtgespenst macro pad (playbooks/nachtgespenst-setup.yml).
    # mak and muk are not members of this group: its play skips them.
    nachtgespenst:
      hosts:
        mik:
      vars:
        target_user: kruse
        jbang_install_dir: /opt/jbang
        # Repository and CachyOS packages for building the firmware (PlatformIO), the Java tools (JDK 27, JBang),
        # the site (Node), the BPF loader (clang, llvm, libbpf, bpf) and for working with Claude Code
        # (bubblewrap and socat are the tools of its sandbox).
        nachtgespenst_packages:
          - python
          - python-pip
          - platformio-core
          - platformio-core-udev
          - esptool
          - cmake
          - ninja
          - unzip
          - git
          - base-devel
          - jq
          - jdk-openjdk
          - nodejs
          - npm
          - v4l-utils
          - clang
          - llvm
          - libbpf
          - bpf
          - bubblewrap
          - socat
          - gitleaks
          - claude-code
        # trufflehog is what the pre-push hook of the repositories calls: the release binary of this version is
        # installed (checksum from the release), unless the AUR package trufflehog-bin is installed already.
        trufflehog_version: 3.100.0
        # AUR packages: not installable by the pacman module. They are only checked, never built here.
        # zoom is installed on mik already.
        nachtgespenst_aur_packages:
          - zoom
