#!/usr/bin/env ansible-playbook
---
- name: Extract Diagnostics and Logs from All Servers
  hosts: all
  gather_facts: false
  vars:
    ansible_user: kruse
    local_log_dir: "/tmp/logs_{{ inventory_hostname }}"
    log_commands:
      - {file: dmesg_warn.log, argv: [dmesg, -T, '--level=emerg,alert,crit,err,warn']}
      - {file: dmesg_full.log, argv: [dmesg, -T]}
      - {file: journal_current_boot.log, argv: [journalctl, --boot=0, --no-pager]}
      - {file: ssh_auth.log, argv: [journalctl, --unit=sshd.service, --boot=0, --no-pager]}
      - {file: sensors.log, argv: [sensors]}
      - {file: shutdown_history.log, argv: [last, -x, shutdown, reboot]}
      - {file: memory.log, argv: [free, -h]}

  tasks:
    # -------------------------------------------------------------------------
    # 1. Collect Diagnostics
    # -------------------------------------------------------------------------
    - name: List boots recorded in the journal
      ansible.builtin.command:
        argv: [journalctl, --list-boots, --output=json]
      register: journal_boots
      changed_when: false

    - name: Collect kernel, journal, SSH and hardware diagnostics
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop: "{{ log_commands + previous_boot_log }}"
      loop_control:
        label: "{{ item.file }}"
      vars:
        previous_boot_log: >-
          {{ [{'file': 'journal_previous_boot.log', 'argv': ['journalctl', '--boot=-1', '--no-pager']}]
              if journal_boots.stdout | from_json | length > 1 else [] }}
      register: diagnostics
      changed_when: false

    # -------------------------------------------------------------------------
    # 2. Store Logs on the Controller
    # -------------------------------------------------------------------------
    - name: Ensure host-specific local log directory exists
      ansible.builtin.file:
        path: "{{ local_log_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Write diagnostics to the local log directory
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ local_log_dir }}/{{ item.item.file }}"
        mode: "0644"
      loop: "{{ diagnostics.results }}"
      loop_control:
        label: "{{ local_log_dir }}/{{ item.item.file }}"
      delegate_to: localhost
      become: false
