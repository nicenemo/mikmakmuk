#!/usr/bin/env ansible-playbook
---
# =============================================================================
# Master Cluster Teardown Playbook (Elasticsearch & Kibana)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Kibana Teardown
# -----------------------------------------------------------------------------

- name: Import Kibana Certificates Teardown Playbook
  ansible.builtin.import_playbook: playbooks/kibana-certs-teardown.yml

- name: Import Kibana Uninstall Playbook
  ansible.builtin.import_playbook: playbooks/kibana-uninstall.yml

# -----------------------------------------------------------------------------
# 2. Elasticsearch Teardown
# -----------------------------------------------------------------------------

- name: Import Elasticsearch Certificates Teardown Playbook
  ansible.builtin.import_playbook: playbooks/elasticsearch-certs-teardown.yml

- name: Import Elasticsearch Uninstall Playbook
  ansible.builtin.import_playbook: playbooks/elasticsearch-uninstall.yml

- name: Import Root CA Teardown Playbook
  ansible.builtin.import_playbook: playbooks/ca-teardown.yml

# -----------------------------------------------------------------------------
# 3. Base Teardown
# -----------------------------------------------------------------------------

- name: Import Network Teardown Playbook
  ansible.builtin.import_playbook: playbooks/network-teardown.yml

- name: Import Trim Teardown Playbook
  ansible.builtin.import_playbook: playbooks/trim-teardown.yml

- name: Import FSTAB Teardown Playbook
  ansible.builtin.import_playbook: playbooks/fstab-teardown.yml

- name: Import Kernel Teardown Playbook
  ansible.builtin.import_playbook: playbooks/kernel-teardown.yml

- name: Import Base Teardown Playbook
  ansible.builtin.import_playbook: playbooks/base-teardown.yml
